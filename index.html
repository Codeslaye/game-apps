<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1E5E48">
<title>Family Apps</title>
<style>
:root{--bg:#EDF1EC;--surface:#fff;--ink:#1C2924;--muted:#566660;--green:#1E5E48;--gold:#C2902A;--berry:#9E3446;--line:#C9D4CD}
@media (prefers-color-scheme:dark){:root{--bg:#121D19;--surface:#1B2A24;--ink:#E7EFEA;--muted:#A3B5AC;--green:#6CC3A0;--gold:#E3B652;--berry:#E07A8A;--line:#33483F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 system-ui,"Kefa",sans-serif}
html[lang="am"] body{font-family:"Kefa",system-ui,sans-serif}
.tibeb{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 14px,var(--gold) 14px 18px,var(--berry) 18px 30px,var(--gold) 30px 34px);border-bottom:4px solid var(--gold)}
main{max-width:900px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.9rem;text-wrap:balance}.en{color:var(--muted);font-size:1rem}
.lang{min-height:52px;padding:8px 20px;border-radius:999px;border:2px solid var(--green);color:var(--green);font:inherit;font-weight:700;background:var(--surface);cursor:pointer}
.lang:focus-visible,a.app:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
a.app{display:flex;gap:18px;align-items:center;min-height:120px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;color:inherit;text-decoration:none}
a.app:active{transform:scale(.98)}a.app:hover{border-color:var(--green)}
a.app img{width:88px;height:88px;border-radius:20px;flex:none}a.app b{font-size:1.3rem;display:block}
.how{background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:18px 20px}
.how ol{margin:8px 0 0;padding-left:1.3em}.how li{margin:6px 0}
.note{color:var(--muted);font-size:1rem;margin:0}
</style>
</head>
<body>
<div class="tibeb"></div>
<main>
<div class="top">
<h1 data-am="የቤተሰብ መተግበሪያዎች" data-en="Family Apps">Family Apps</h1>
<button class="lang" type="button" id="langBtn">አማርኛ</button>
</div>
<!-- Install instructions, hidden for now. Remove the comment markers to show them again.
<div class="how"><b>እንዴት እንደሚጫን · How to install</b>
<ol>
<li>ከታች አንዱን ይንኩ። <span class="en">Tap one of the apps below.</span></li>
<li>የማጋሪያ ምልክቱን (□↑) ይንኩና «Add to Home Screen» ይምረጡ። <span class="en">Tap the Share button (□↑), then “Add to Home Screen.”</span></li>
<li>ከዚያ ሁልጊዜ ከHome Screen ምልክቱ ይክፈቱት፤ ያለ ኢንተርኔትም ይሠራል። <span class="en">From then on, always open it from its Home Screen icon. It works without internet.</span></li>
</ol></div>
-->
<div class="apps">
<a class="app" href="brain-games/index.html"><img src="brain-games/icon-180.png" alt=""><b data-am="የቤተሰብ የአእምሮ ጨዋታዎች" data-en="Family Brain Games">Family Brain Games</b></a>
<a class="app" href="recipes/index.html"><img src="recipes/icon-180.png" alt=""><b data-am="የምግብ ደብተር" data-en="Recipe Book">Recipe Book</b></a>
<a class="app" href="family-tree/index.html"><img src="family-tree/icon-180.png" alt=""><b data-am="የቤተሰባችን ሐረግ" data-en="Our Family Tree">Our Family Tree</b></a>
<a class="app" href="bible/index.html"><img src="bible/icon-180.png" alt=""><b data-am="የመጽሐፍ ቅዱስ ጨዋታዎች" data-en="Bible Games">Bible Games</b></a>
</div>
<p class="note" data-am="የሚጽፉት ሁሉ በዚህ አይፓድ ላይ ብቻ ይቀመጣል። ወደ የትም አይላክም።" data-en="Everything you type is saved only on this iPad. Nothing is sent anywhere.">Everything you type is saved only on this iPad. Nothing is sent anywhere.</p>
</main>
<script>
(function(){
  var lang="en";try{lang=localStorage.getItem("family.lang")||"en"}catch(e){}
  function apply(){
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-am]").forEach(function(el){el.textContent=el.getAttribute(lang==="am"?"data-am":"data-en")});
    document.getElementById("langBtn").textContent=lang==="am"?"English":"አማርኛ";
    document.title=lang==="am"?"የቤተሰብ መተግበሪያዎች":"Family Apps";
  }
  document.getElementById("langBtn").onclick=function(){lang=lang==="am"?"en":"am";try{localStorage.setItem("family.lang",lang)}catch(e){}apply()};
  window.addEventListener("pageshow",function(){try{var l=localStorage.getItem("family.lang");if(l&&l!==lang){lang=l;apply()}}catch(e){}});
  apply();
})();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}
</script>
</body>
</html>
